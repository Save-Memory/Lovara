<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Your Letter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-center">

  <!-- زر التحكم في الموسيقى (شفاف) -->
  <button id="musicToggle" class="music-btn" aria-label="Toggle Music">
    <span id="musicIcon">🎵</span>
  </button>

  <!-- طبقة التعتيم للخلفية -->
  <div class="dark-overlay" id="darkOverlay"></div>

  <!-- خلفية القلوب المفرغة الثابتة -->
  <div class="hearts-container">
    <div class="heart-item h-left-1"></div>
    <div class="heart-item h-left-2"></div>
    <div class="heart-item h-left-3"></div>
    <div class="heart-item h-left-4"></div>

    <div class="heart-item h-right-1"></div>
    <div class="heart-item h-right-2"></div>
    <div class="heart-item h-right-3"></div>
    <div class="heart-item h-right-4"></div>
  </div>

  <!-- الحاوية الرئيسية -->
  <div class="main-letter-wrapper">

    <!-- الظرف المغلق -->
    <div class="envelope-sealed" id="sealedEnvelope">
      <div class="env-top-flap"></div>
      <div class="wax-seal">M</div>
      <div class="env-bottom-pocket"></div>
      <p class="envelope-hint">Click Here to open</p>
    </div>

    <!-- كارت الرسالة الأبيض -->
    <div class="card-letter hidden-letter" id="fullLetter">
      <div class="letter-content">
        <h3>Happy Birthday Maloka</h3>
        <p class="english-text" id="typewriterText"></p>
      </div>

      <div class="letter-footer">
        <p>I will always love you</p>
      </div>
    </div>

  </div>

  <!-- رابط العودة للصفحة الرئيسية مع إيقاف الصوت -->
  <a href="index.html" class="back-link" id="backLink">
    <span>↩</span> Go back
  </a>

  <!-- عنصر الموسيقى -->
  <audio id="bgMusic" src="music.mp3" preload="auto" loop></audio>

  <script>
    const envelope = document.getElementById("sealedEnvelope");
    const letter = document.getElementById("fullLetter");
    const darkOverlay = document.getElementById("darkOverlay");
    const typewriterText = document.getElementById("typewriterText");
    const bgMusic = document.getElementById("bgMusic");
    const backBtn = document.getElementById("backLink");
    const musicToggle = document.getElementById("musicToggle");
    const musicIcon = document.getElementById("musicIcon");

    const messageText = "Happy birthday to the most beautiful gift God has given me. I love your smile, your words, your playful spirit, and the way you look at me. Always stay radiant and happy, your smile makes my life more beautiful. I will always be by your side and proud of you.";

    // تحديث شكل الإيموجي (🎵 أو 🔇)
    function updateMusicUI() {
      if (!bgMusic || !musicIcon) return;
      if (bgMusic.paused) {
        musicIcon.textContent = "🔇";
      } else {
        musicIcon.textContent = "🎵";
      }
    }

    // استرجاع حالة وقت الموسيقى والـ Mute
    function initAudio() {
      const savedTime = localStorage.getItem("audioTime");
      const isMuted = localStorage.getItem("audioMuted") === "true";

      if (savedTime && bgMusic) {
        bgMusic.currentTime = parseFloat(savedTime);
      }

      if (!isMuted && bgMusic) {
        bgMusic.play().then(updateMusicUI).catch(() => {
          updateMusicUI();
        });
      } else {
        updateMusicUI();
      }
    }

    // زر التبديل (Play / Pause)
    if (musicToggle) {
      musicToggle.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!bgMusic) return;

        if (bgMusic.paused) {
          bgMusic.play().then(() => {
            localStorage.setItem("audioMuted", "false");
            updateMusicUI();
          });
        } else {
          bgMusic.pause();
          localStorage.setItem("audioMuted", "true");
          updateMusicUI();
        }
      });
    }

    // عند الضغط على الظرف
    envelope.addEventListener("click", function () {
      const isMuted = localStorage.getItem("audioMuted") === "true";
      if (!isMuted && bgMusic && bgMusic.paused) {
        bgMusic.play().then(updateMusicUI).catch(() => {});
      }

      envelope.classList.add("fade-out");
      
      setTimeout(() => {
        envelope.style.display = "none";
        darkOverlay.classList.add("active");
        letter.classList.remove("hidden-letter");
        letter.classList.add("fade-in");

        if (backBtn) {
          backBtn.classList.add("is-visible");
        }

        startTypewriter(messageText, 0);
      }, 500);
    });

    // إفكت كتابة النص حرفاً بحرف
    function startTypewriter(text, i) {
      if (i < text.length) {
        typewriterText.innerHTML += text.charAt(i);
        setTimeout(() => startTypewriter(text, i + 1), 45);
      }
    }

    // حفظ التوقيت باستمرار
    if (bgMusic) {
      bgMusic.addEventListener("timeupdate", () => {
        localStorage.setItem("audioTime", bgMusic.currentTime);
      });
    }

    // 🛑 إيقاف الموسيقى وإلغاء التوقيت المحفوظ عند العودة للرئيسية (مضمون للأندرويد والآيفون)
    if (backBtn) {
      backBtn.addEventListener("click", function (e) {
        e.preventDefault(); // يمنع الانتقال السريع قبل إيقاف الصوت
        
        if (bgMusic) {
          bgMusic.pause();
          bgMusic.currentTime = 0;
        }

        // مسح بيانات الصوت وتصفيرها
        localStorage.removeItem("audioTime");
        localStorage.setItem("audioMuted", "false");

        // الانتقال للرئيسية فوراً بعد إيقاف الصوت
        window.location.href = this.href;
      });
    }

    // تشغيل عند فتح الصفحة
    window.addEventListener("DOMContentLoaded", initAudio);
  </script>
</body>
</html>
